<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>결 성격유형 테스트 · 10문항 1분 컷</title>
<meta name="description" content="10문항, 1분이면 끝나는 재미로 보는 성격유형 테스트. 내 유형과 강점, 어울리는 직업, 잘 맞는 유형까지 바로 확인하세요.">
<meta property="og:title" content="결 성격유형 테스트">
<meta property="og:description" content="10문항 · 1분 · 16유형 + 정서 -C/-E">
<meta name="theme-color" content="#6d5dfc">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%236d5dfc'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='white' font-family='sans-serif'%3E%EA%B2%B0%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#" data-go="start">결<span>성격유형 테스트</span></a>
  <button class="link" data-go="types">16유형</button>
</header>

<main id="app">
  <section id="screen-start" class="screen">
    <div class="card hero">
      <p class="eyebrow">10문항 · 약 1분</p>
      <h1>나는 어떤<br><em>유형</em>일까?</h1>
      <p class="lead">가볍게 10문항만 답하면 나의 성격유형, 강점, 어울리는 직업, 잘 맞는 유형까지 바로 알려 드려요.</p>
      <button id="btn-start" class="btn primary big">시작하기</button>
      <p class="hint">정답은 없어요. 첫 느낌대로 골라 주세요.</p>
    </div>
  </section>

  <section id="screen-quiz" class="screen" hidden>
    <div class="progress"><div id="progress-bar"></div></div>
    <p id="progress-text" class="progress-text"></p>
    <div class="card q">
      <p id="q-text" class="q-text"></p>
      <div id="q-choices" class="choices"></div>
    </div>
    <button id="btn-prev" class="btn">이전</button>
  </section>

  <section id="screen-result" class="screen" hidden></section>

  <section id="screen-types" class="screen" hidden>
    <h2 class="page-title">16유형 한눈에 보기</h2>
    <div id="types-grid"></div>
  </section>

  <section id="screen-typedetail" class="screen" hidden></section>
</main>

<footer class="footer"><p id="notice"></p></footer>
<div id="toast" class="toast" role="status" hidden></div>

<script src="js/questions.js"></script>
<script src="js/scoring.js"></script>
<script src="js/content.js"></script>
<script src="js/types.js"></script>
<script src="js/types-2.js"></script>
<script src="js/types-3.js"></script>
<script src="js/types-4.js"></script>
<script src="js/app.js"></script>
</body>
</html>
